<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wizard Prompt Animasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9F0FB; --panel:#FFFFFF; --ink:#1B2550; --muted:#5B6488; --line:#CBD5EA;
  --sun:#F2B21B; --sunInk:#3A2A00; --teal:#1FA59A; --tealSoft:#D8F2EF; --chip:#F2F5FC; --danger:#C2412D;
  --code:#F5F8FE;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121733; --panel:#1C2347; --ink:#EEF1FF; --muted:#A3ABCF; --line:#323C6B;
    --sun:#F5BE3A; --sunInk:#2A1E00; --teal:#3CC4B7; --tealSoft:#183A44; --chip:#252D58; --danger:#F07862;
    --code:#161C3D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121733; --panel:#1C2347; --ink:#EEF1FF; --muted:#A3ABCF; --line:#323C6B;
  --sun:#F5BE3A; --sunInk:#2A1E00; --teal:#3CC4B7; --tealSoft:#183A44; --chip:#252D58; --danger:#F07862;
  --code:#161C3D; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Baloo 2","Plus Jakarta Sans",system-ui,sans-serif;line-height:1.15;margin:0}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 120px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 18px}
header.top h1{font-size:clamp(28px,5vw,40px);font-weight:800}
header.top p{margin:4px 0 0;color:var(--muted)}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--ink)}

/* stepper */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.steps button{flex:1 0 auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:8px 12px;border-radius:999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.steps button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--chip);font-size:12px}
.steps button.on{border-color:var(--ink);color:var(--ink)}
.steps button.on .n{background:var(--sun);color:var(--sunInk)}
.steps button.done .n{background:var(--teal);color:#fff}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.panel h2{font-size:26px;font-weight:800}
.lead{color:var(--muted);margin:4px 0 18px;max-width:62ch}
.group{margin-top:20px}
.group > label.t, .group > .t{display:block;font-weight:700;margin-bottom:8px}
.hint{color:var(--muted);font-size:13px;margin-top:6px}

/* option tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{position:relative;text-align:left;background:var(--chip);border:2px solid transparent;border-radius:14px;padding:12px 12px 12px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.tile:hover{border-color:var(--line)}
.tile.on{border-color:var(--ink);background:var(--panel);box-shadow:inset 0 0 0 1px var(--ink)}
.tile .em{font-size:22px;line-height:1}
.tile b{display:block;margin-top:6px;font-size:14px}
.tile span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tile.on::after{content:"✓";position:absolute;top:8px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--sun);color:var(--sunInk);display:grid;place-items:center;font-size:12px;font-weight:800}

.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}

input[type=text],textarea,select{width:100%;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--sun) 70%,transparent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:620px){.row{grid-template-columns:1fr}}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;margin:6px 0}
.check input{width:18px;height:18px;accent-color:var(--teal)}

/* characters */
.char{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--panel)}
.char-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.char-head input{font-weight:700}
.x{background:none;border:none;color:var(--danger);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.add{width:100%;border:2px dashed var(--line);background:none;border-radius:14px;padding:14px;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.add:hover{color:var(--ink);border-color:var(--ink)}

/* scenes */
.scene{display:grid;grid-template-columns:44px 1fr;gap:12px;border-top:1px dashed var(--line);padding:14px 0}
.scene:first-of-type{border-top:none}
.scene .num{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:26px;color:var(--teal);line-height:1}
.scene .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media (max-width:620px){.scene .opts{grid-template-columns:1fr}}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}

/* results — storyboard frames */
.styletabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0}
.frame{position:relative;border:2px solid var(--ink);border-radius:6px;margin:18px 0;background:var(--panel)}
.frame .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--ink);color:var(--panel);padding:8px 12px;
  background-image:repeating-linear-gradient(90deg,transparent 0 14px,color-mix(in srgb,var(--panel) 25%,transparent) 14px 22px);
  background-size:100% 4px;background-repeat:no-repeat;background-position:bottom}
.frame .bar h3{font-size:18px;font-weight:800}
.frame .bar small{opacity:.8;font-size:12px}
.frame .body{padding:12px}
.pblock{margin:10px 0 14px}
.pblock .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--tealSoft);color:var(--ink)}
.tag.v{background:color-mix(in srgb,var(--sun) 30%,var(--panel))}
.tag.n{background:var(--chip);color:var(--muted)}
pre.p{margin:0;white-space:pre-wrap;word-break:break-word;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);max-height:none}
.copy{background:var(--sun);color:var(--sunInk);border:none;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.copy.ok{background:var(--teal);color:#fff}
.tips{background:var(--tealSoft);border-radius:14px;padding:14px 16px;margin-top:18px}
.tips h3{font-size:18px;margin-bottom:6px}
.tips ol{margin:0;padding-left:20px}
.tips li{margin:4px 0}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.nav .in{max-width:920px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:none;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--panel)}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.nav .info{color:var(--muted);font-size:13px;text-align:center;flex:1}
.ai{display:inline-flex;align-items:center;gap:6px;background:var(--tealSoft);color:var(--ink);border:1px solid var(--teal);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.ai:hover{background:var(--teal);color:#fff}
.ai:disabled{opacity:.6;cursor:wait}
.ai.sm{padding:5px 10px;border-radius:8px}
.spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.aibox{background:var(--chip);border-radius:14px;padding:14px;margin:14px 0}
.aibox .row{align-items:end}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,520px);z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--danger);color:#fff}
.warn{margin-top:8px;font-size:13px;background:color-mix(in srgb,var(--sun) 18%,var(--panel));border-left:3px solid var(--sun);border-radius:8px;padding:8px 10px}
.warn:empty{display:none}
.warn ul{margin:0;padding-left:18px}
.hemat-sum{border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:14px;background:color-mix(in srgb,var(--sun) 22%,var(--panel))}
.hemat-sum.ok{background:var(--tealSoft)}
.idnote{border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:14px;background:var(--chip);border:1px solid var(--teal);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.idnote[hidden]{display:none}
.err{color:var(--danger);font-size:13px;font-weight:600;margin-top:8px}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Wizard Prompt Animasi</h1>
      <p>Susun prompt gambar &amp; video adegan demi adegan, siap tempel ke Google Flow atau Canva.</p>
    </div>
    <button class="ghost" id="resetBtn" title="Hapus semua isian dan mulai dari awal">Mulai ulang</button>
  </header>
  <nav class="steps" id="steps" aria-label="Langkah"></nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="nav"><div class="in">
  <button class="btn sec" id="back">Kembali</button>
  <div class="info" id="info"></div>
  <button class="btn pri" id="next">Lanjut</button>
</div></div>

const $=s=>document.querySelector(s);

function joinNames(arr){if(!arr.length)return"the characters";if(arr.length===1)return arr[0];return arr.slice(0,-1).join(", ")+" and "+arr[arr.length-1]}
function fill(t){const n=names();const th=currentTheme();
  return t.replaceAll("{A}",n[0]||"the main character").replaceAll("{B}",n[1]||"a friend").replaceAll("{ALL}",joinNames(n))
   .replaceAll("{SET}",th.setting||"the world").replaceAll("{THEME}",th.name||"the story")}
function currentTheme(){if(S.theme==="dance"){const dz=danceObj();return{name:"Joget "+dz.name.replace(/^Joget /,""),setting:en(VENUES,S.dance.venue),beats:danceBeats(dz)}}
  if(S.theme==="custom")return{name:S.customTheme.name.trim(),setting:S.customTheme.setting.trim()||S.customTheme.name.trim(),beats:GENERIC_BEATS};
  const t=THEMES.find(x=>x.id===S.theme)||THEMES[0];return{name:t.name,setting:t.setting,beats:t.beats}}

function pickBeats(n){const b=currentTheme().beats;if(n<=0)return[];
 if(n===1)return[b[Math.floor((b.length-1)/2)]];
 if(n<=b.length)return Array.from({length:n},(_,k)=>b[Math.round(k*(b.length-1)/(n-1))]);
 const extra=GENERIC_BEATS.filter(x=>!b.includes(x));const out=b.slice(0,-1);
 for(let k=0;out.length<n-1;k++)out.push(extra[k%extra.length]);out.push(b[b.length-1]);return out}
function autoScene(text,i,n){if(S.theme==="dance")return{text:fill(text),shot:i===n-1&&n>1?"Medium shot":"Wide shot",cam:i===n-1&&n>1?"Zoom in perlahan":"Statis",dialog:"",sing:""};

function renderSteps(){$("#steps").innerHTML=STEPS.map((s,i)=>`<button class="${i===S.step?"on":""} ${i<S.step?"done":""}" data-go="${i}" ${i===S.step?'aria-current="step"':""}><span class="n">${i<S.step?"✓":i+1}</span>${s}</button>`).join("")}
function tile(on,em,name,desc,attr){return`<button class="tile ${on?"on":""}" ${attr} aria-pressed="${on}"><span class="em">${em}</span><b>${esc(name)}</b><span>${esc(desc)}</span></button>`}
function seg(list,cur,key){return`<div class="seg">${list.map(o=>`<button class="${o===cur?"on":""}" data-set="${key}" data-val="${esc(o)}">${esc(o)}</button>`).join("")}</div>`}

()=>{if(TR.busy)return`<section class="panel"><h2>Prompt siap pakai</h2><div class="aibox" style="display:flex;gap:10px;align-items:center"><span class="spin"></span> Menerjemahkan isianmu ke bahasa Inggris…</div></section>`;
 if(!S.styles.includes(S.activeStyle))S.activeStyle=S.styles[0];const st=styleObj(S.activeStyle);
 const block=(tag,cls,title,text,id,kind)=>{const key=S.activeStyle+"|"+id;SRC[id]={text,kind};const pol=S.polished[key];const isPol=pol&&pol.src===text;
  const aiBtn=kind?(isPol?`<button class="ai sm" data-unpolish="${id}">Kembalikan versi asli</button>`:`<button class="ai sm" data-polish="${id}">✨ Perbaiki</button>`):"";
  return`<div class="pblock"><div class="ph"><span class="tag ${cls}">${title}${isPol?" · ✨ AI":""}</span><div class="btns">${aiBtn}<button class="copy" data-copy="${id}">Salin</button></div></div><pre class="p" id="${id}">${esc(isPol?pol.out:text)}</pre></div>`};
 let html=`<section class="panel"><h2>Prompt siap pakai</h2><p class="lead">${S.scenes.length} adegan × ${S.styles.length} gaya. Pilih gaya di bawah, lalu salin prompt per adegan.</p>
 ${S.autoEn&&TR.err?`<div class="warn" style="margin-bottom:12px">Terjemahan otomatis gagal: ${esc(TR.err)} Prompt di bawah masih memakai isian aslimu. <button class="ai sm" id="retryTr">Coba lagi</button></div>`:""}
 ${S.autoEn&&!TR.err?(()=>{const n=trSources().filter(k=>S.tr[k]&&S.tr[k]!==k).length;
   return n?`<p class="hint" style="margin-top:-8px">${n} isian berbahasa Indonesia diterjemahkan otomatis; isian yang sudah bahasa Inggris dibiarkan. Isian aslimu tidak diubah. <button class="x" id="retryTr" style="color:var(--teal)">Terjemahkan ulang</button></p>`
   :`<p class="hint" style="margin-top:-8px">Semua isian sudah bahasa Inggris, jadi tidak ada yang diterjemahkan.</p>`})():""}
 <div class="toolbar"><button class="copy" id="copyAll">Salin semua prompt gaya ini</button></div>
 <div class="styletabs seg">${S.styles.map(id=>{const s=styleObj(id);return`<button class="${id===S.activeStyle?"on":""}" data-tab="${id}">${s.em} ${esc(s.name)}${S.hemat&&S.styles.length>1&&id===S.finalStyle?" ⭐":""}</button>`}).join("")}</div>`;
 const orig=st.id==="original";
 if(orig)html+=`<p class="hint">Gaya Ikuti gambar asli: hanya prompt Image → Video yang ditampilkan. Unggah gambarmu sendiri sebagai frame awal di Flow atau Canva.</p>`;
 if(!orig)html+=`<div class="frame"><div class="bar"><h3>Referensi karakter</h3><small>Buat dulu, pakai sebagai acuan</small></div><div class="body">
  ${S.chars.map((c,i)=>block("", "", "Sheet: "+(c.name.trim()||"Karakter "+(i+1)),promptSheet(st,c,i),`sh${i}`,"sheet")).join("")}</div></div>`;
 const testOnly=S.hemat&&S.styles.length>1&&S.finalStyle!==S.activeStyle;
 if(testOnly)html+=`<div class="aibox"><b>Mode uji gaya.</b> Gaya ini hanya ditampilkan untuk adegan 1, supaya kredit tidak habis untuk mencoba semua gaya di semua adegan. Kalau hasil adegan 1 sudah cocok, jadikan gaya final.<div style="margin-top:8px"><button class="ai" data-final="${S.activeStyle}">⭐ Jadikan gaya final</button></div></div>`;
 else if(S.hemat&&S.styles.length>1)html+=`<p class="hint">⭐ Ini gaya final, semua adegan ditampilkan. <button class="x" data-final="">Batalkan</button></p>`;
 (testOnly?S.scenes.slice(0,1):S.scenes).forEach((sc,i)=>{html+=`<div class="frame"><div class="bar"><h3>Adegan ${i+1}</h3><small>${esc(sc.shot)} · ${esc(sc.cam)}</small></div><div class="body">
  ${S.modes.t2i&&!orig?block("","","Text → Image",promptT2I(st,sc,i),`t${i}`,"image"):""}
  ${S.modes.i2v?block("","v","Image → Video",promptI2V(st,sc,i),`v${i}`,"video"):""}
  ${S.modes.t2v&&!orig?block("","v","Text → Video",promptT2V(st,sc,i),`x${i}`,"t2v"):""}
 </div></div>`});
 if(S.neg)html+=`<div class="frame"><div class="bar"><h3>Negative prompt</h3><small>Tempel jika platform menyediakan kolomnya</small></div><div class="body">
  ${S.modes.t2i&&!orig?block("","n","Untuk gambar",NEG_IMG,"ni"):""}${S.modes.i2v||S.modes.t2v?block("","n","Untuk video",NEG_VID+(S.hemat?", scene cuts, multiple actions in one clip":"")+(orig?", style change, cartoon filter, color shift, re-rendered look":""),"nv"):""}</div></div>`;
 html+=S.platform==="flow"?`<div class="tips"><h3>Cara pakai di Google Flow</h3><ol>
  <li>Generate gambar <b>sheet karakter</b> dulu, simpan yang paling cocok sebagai acuan (ingredient).</li>
  <li>Buat gambar tiap adegan dengan prompt Text → Image, sertakan gambar karakter sebagai referensi agar wajah dan baju konsisten.</li>
  <li>Pakai mode dari gambar ke video (frame awal), tempel prompt Image → Video untuk adegan yang sama.</li>
  <li>Tambahkan klip ke scene builder sesuai urutan nomor adegan, lalu sambung jadi satu film.</li>
  <li>Kalau karakter berubah bentuk, perpendek aksinya atau pilih kamera Statis.</li>
  ${S.hemat?`<li>Kalau tersedia pilihan model Fast dan Quality, cek gerakan dulu dengan Fast, lalu render ulang dengan Quality hanya untuk adegan yang sudah pas.</li><li>Ulangi gambar sampai benar-benar cocok sebelum dijadikan video, karena gambar jauh lebih murah daripada video.</li>`:""}</ol></div>`
 :`<div class="tips"><h3>Cara pakai di Canva</h3><ol>
  <li>Buka fitur generate gambar AI di Canva, tempel prompt Text → Image per adegan dengan rasio ${S.ar}.</li>
  <li>Untuk video, pakai fitur generate video AI dan tempel prompt Image → Video atau Text → Video.</li>
  <li>Susun semua klip di timeline video Canva sesuai nomor adegan, lalu tambah musik, teks dan transisi.</li>
  <li>Prompt sudah dibuat ringkas; kalau hasil kurang detail, pindah ke mode Google Flow untuk versi lengkap.</li></ol></div>`;
 if(danceObj())html+=`<div class="tips" style="margin-top:12px"><h3>Tips joget &amp; lipsync</h3><ol>
  <li>Satu klip cukup 1–2 gerakan. Kamera wide dan statis paling aman supaya seluruh badan terlihat.</li>
  <li>Kalau karakter bernyanyi, Flow membuat melodinya sendiri, bukan melodi lagu asli.</li>
  ${S.dance.ownSong?`<li>Prompt sudah meminta video tanpa musik. Tempel lagumu di Canva atau editor video, lalu potong klip tepat di ketukan lagu.</li>`:`<li>Mau pakai lagu sendiri? Centang "Pakai lagu sendiri nanti" di langkah Tema.</li>`}
  <li>Untuk gerak bibir yang sinkron dengan lagu asli, pakai aplikasi lip sync khusus yang menerima file audio, setelah klipnya jadi.</li>
  <li>Lagu terkenal bisa kena klaim hak cipta di YouTube, TikTok, atau Reels. Lebih aman pakai musik bebas lisensi atau dari perpustakaan musik platform.</li></ol></div>`;
 return html+`</section>`}
];

function render(){renderSteps();$("#view").innerHTML=VIEWS[S.step]();updateSum();updateIdNote();
 $("#back").disabled=S.step===0;$("#next").textContent=S.step===STEPS.length-1?"Edit adegan":S.step===STEPS.length-2?"Buat prompt":"Lanjut";
 $("#info").textContent=`Langkah ${S.step+1} dari ${STEPS.length}`;save()}

function validate(){const e=[];if(S.step===4&&!S.scenes.length)buildScenes();
 if(S.step===0&&!Object.values(S.modes).some(Boolean))e.push("Pilih minimal satu jenis prompt.");
 if(S.step===1&&!S.styles.length)e.push("Pilih minimal satu gaya.");
 if(S.step===1&&isOriginal()&&!S.modes.i2v)e.push("Gaya Ikuti gambar asli butuh Image → Video. Nyalakan di langkah Format.");
 if(S.step===1&&S.styles.includes("custom")&&!S.customStyle.trim())e.push("Tulis deskripsi gaya sendiri, atau batalkan pilihan Gaya sendiri.");
 if(S.step===2&&S.theme==="custom"&&!S.customTheme.name.trim())e.push("Tulis nama atau ide tema barumu.");
 if(S.step===3&&!S.chars.some(c=>c.name.trim()))e.push("Beri nama minimal satu karakter.");
 if(S.step===4&&!S.scenes.some(s=>s.text.trim()))e.push("Isi minimal satu adegan.");
 const old=$("#view .err");if(old)old.remove();
 if(e.length){const p=document.createElement("p");p.className="err";p.textContent=e[0];$("#view .panel").appendChild(p);return false}return true}

function go(n){if(n>S.step){for(let s=S.step;s<n;s++){if(!validate())return;S.step++} }else S.step=n;render();window.scrollTo({top:0});if(S.step===STEPS.length-1)autoTranslate()}

/* ---------------- AI ---------------- */
const SRC={};
function toast(msg,bad){const t=$("#toast");t.textContent=msg;t.className="toast"+(bad?" bad":"");t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,bad?6000:2600)}
async function ai(task,data,btn){
 const old=btn?btn.innerHTML:"";if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Sedang diproses…'}
 try{
  if(location.protocol==="file:")throw new Error("Fitur AI baru aktif setelah di-deploy ke Vercel atau dijalankan dengan \"vercel dev\".");
  let code="";try{code=localStorage.getItem(KEY+":code")||""}catch(e){}
  const send=c=>fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json","x-access-code":c},body:JSON.stringify({task,data})});
  let r=await send(code);
  if(r.status===401){const c=prompt("Masukkan kode akses untuk memakai fitur AI:");if(!c)throw new Error("Kode akses dibutuhkan untuk fitur AI.");
   try{localStorage.setItem(KEY+":code",c)}catch(e){}r=await send(c);if(r.status===401){try{localStorage.removeItem(KEY+":code")}catch(e){}}}
  const j=await r.json().catch(()=>({}));
  if(r.status===404)throw new Error("Endpoint /api/generate tidak ditemukan. Pastikan folder api ikut ter-deploy.");
  if(!r.ok)throw new Error(j.error||("Permintaan gagal ("+r.status+")."));
  return j.result||{};
 }finally{if(btn){btn.disabled=false;btn.innerHTML=old}}
}
async function runAI(id,btn){
 try{
  if(id==="aiSetting"){if(!S.customTheme.name.trim())return toast("Tulis dulu nama atau ide temanya.",true);
   const r=await ai("setting",{name:S.customTheme.name,setting:S.customTheme.setting},btn);
   if(r.setting){S.customTheme.setting=r.setting;S.scenes=[];render();toast("Deskripsi latar sudah dibuat.")}}
  if(id==="aiChars"){const r=await ai("characters",{chars:S.chars},btn);
   if(Array.isArray(r.chars)){r.chars.forEach((c,i)=>{if(!S.chars[i])return;["age","look","outfit","trait"].forEach(k=>{if(typeof c[k]==="string")S.chars[i][k]=c[k]})});render();toast("Deskripsi karakter sudah dirapikan.")}}
  if(id==="aiTranslate"){const idx=S.scenes.map((s,i)=>isIndo(s.text)?i:-1).filter(i=>i>-1);if(!idx.length)return;
   const r=await ai("translate",{texts:idx.map(i=>S.scenes[i].text),names:S.chars.map(c=>c.name),hemat:S.hemat},btn);
   if(Array.isArray(r.texts)){r.texts.forEach((t,k)=>{if(typeof t==="string"&&t.trim()&&idx[k]!==undefined)S.scenes[idx[k]].text=t.trim()});render();toast(idx.length+" adegan sudah diterjemahkan.")}}
  if(id==="aiScenes"){if(S.scenes.some(s=>s.text.trim())&&!confirm("Ganti semua adegan dengan alur buatan AI?"))return;
   const th=currentTheme();
   const r=await ai("scenes",{theme:th.name,setting:th.setting,mood:en(MOODS,S.mood),chars:S.chars.map(charDesc),count:S.sceneCount,idea:S.storyIdea,hemat:S.hemat,dance:danceObj()?{name:danceObj().en,moves:danceObj().moves.map(fill),tempo:en(TEMPOS,S.dance.tempo),funny:S.dance.funny||danceObj().funny}:null},btn);
   if(Array.isArray(r.scenes)&&r.scenes.length){S.scenes=r.scenes.map(s=>({text:s.text||"",shot:s.shot||"Medium shot",cam:s.cam||"Statis",dialog:s.dialog||"",sing:s.sing||""}));if(r.scenes.some(s=>s.sing))S.audio=true;if(r.scenes.some(s=>s.dialog))S.audio=true;render();toast(r.scenes.length+" adegan baru dari AI.")}}
 }catch(e){toast(e.message,true)}
}
async function polish(id,btn){const src=SRC[id];if(!src)return;
 try{const r=await ai("polish",{kind:src.kind,prompt:src.text,platform:S.platform,hemat:S.hemat,keepStyle:S.activeStyle==="original"},btn);
  if(r.prompt){S.polished[S.activeStyle+"|"+id]={src:src.text,out:r.prompt};render();toast("Prompt sudah diperbaiki AI.")}}
 catch(e){toast(e.message,true)}}

/* ---------------- AUTO TRANSLATE ---------------- */
const TR={busy:false,err:""};
function trSources(){const a=[];S.scenes.forEach(s=>a.push(s.text));
 S.chars.forEach(c=>["age","look","outfit","trait"].forEach(k=>a.push(c[k])));
 if(S.theme==="custom")a.push(currentTheme().setting);
 if(S.styles.includes("custom"))a.push(S.customStyle);
 return[...new Set(a.map(x=>String(x||"").trim()).filter(Boolean))]}
async function autoTranslate(force){if(!S.autoEn||TR.busy)return;
 const all=trSources();const need=all.filter(x=>needsTr(x)&&(force||!(x in S.tr)));
 const keep={};all.forEach(k=>{if(k in S.tr)keep[k]=S.tr[k]});S.tr=keep;save();
 if(!need.length){if(TR.err){TR.err="";render()}return}
 TR.busy=true;TR.err="";render();
 try{const r=await ai("fields",{texts:need,names:S.chars.map(c=>c.name),hemat:S.hemat});
  if(!Array.isArray(r.texts))throw new Error("Respons terjemahan tidak lengkap.");
  need.forEach((k,i)=>{const v=r.texts[i];S.tr[k]=(typeof v==="string"&&v.trim())?v.trim():k});save()}
 catch(e){TR.err=e.message}
 finally{TR.busy=false;render()}}

/* ---------------- EVENTS ---------------- */
function setPath(path,val){const k=path.split(".");let o=S;while(k.length>1)o=o[k.shift()];o[k[0]]=val;save()}
let themeChanged=false;
document.addEventListener("click",e=>{const b=e.target.closest("button,[data-go]");if(!b)return;const d=b.dataset;
 if(d.go!==undefined){const n=+d.go;if(n<=S.step)go(n);else go(n);return}
 if(d.mode){S.modes[d.mode]=!S.modes[d.mode];render();return}
 if(d.set){if(d.set==="platform")S.platform=d.val==="Canva"?"canva":"flow";else S[d.set]=d.val;render();return}
 if(d.style){const i=S.styles.indexOf(d.style);
   if(i>-1)S.styles.splice(i,1);
   else if(d.style==="original")S.styles=["original"];
   else{S.styles=S.styles.filter(x=>x!=="original");S.styles.push(d.style)}
   render();return}
 if(d.dance){if(S.dance.type!==d.dance){S.dance.type=d.dance;S.scenes=[]}render();return}
 if(d.tempo){S.dance.tempo=d.tempo;S.scenes=[];render();return}
 if(d.themePick){if(S.theme!==d.themePick){S.theme=d.themePick;S.scenes=[]}render();return}
 if(d.del){S.chars.splice(+d.del,1);render();return}
 if(d.delscene){S.scenes.splice(+d.delscene,1);render();return}
 if(d.tab){S.activeStyle=d.tab;render();return}
 if(d.final!==undefined){S.finalStyle=d.final;render();return}
 if(d.copy){copyText($("#"+d.copy).textContent,b);return}
 if(b.id==="retryTr"){autoTranslate(true);return}
 if(d.polish){polish(d.polish,b);return}
 if(d.unpolish){delete S.polished[S.activeStyle+"|"+d.unpolish];render();return}
 if(b.id==="aiSetting"||b.id==="aiChars"||b.id==="aiScenes"||b.id==="aiTranslate"){runAI(b.id,b);return}
 if(b.id==="addChar"){S.chars.push({name:"",type:"Anak perempuan",age:"",look:"",outfit:"",trait:""});render();
   const ins=document.querySelectorAll('[data-k="name"]');ins[ins.length-1].focus();return}
 if(b.id==="addScene"){if(S.scenes.length>=12)return toast("Maksimal 12 adegan.",true);S.scenes.push({text:"",shot:"Medium shot",cam:"Statis",dialog:""});render();return}
 if(b.id==="rebuild"){if(confirm("Ganti semua adegan dengan versi otomatis dari tema? Perubahanmu akan hilang.")){buildScenes();render()}return}
 if(b.id==="copyAll"){const t=[...document.querySelectorAll("#view .pblock")].map(p=>"### "+p.querySelector(".tag").textContent.replace(" · ✨ AI","")+"\n"+p.querySelector("pre").textContent).join("\n\n");copyText(t,b);return}
 if(b.id==="next"){S.step===STEPS.length-1?go(4):go(S.step+1);return}
 if(b.id==="back"){go(Math.max(0,S.step-1));return}
 if(b.id==="resetBtn"){if(confirm("Hapus semua isian dan mulai dari awal?")){S=fresh();render()}return}
});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;
 if(d.bind){setPath(d.bind,t.value);if(t.id==="cnt")resizeScenes();return}
 if(d.char!==undefined){S.chars[+d.char][d.k]=t.value;save();
   if(d.k==="name"){const av=t.parentElement.querySelector(".avatar");if(av)av.textContent=(t.value.trim()||"?")[0].toUpperCase()}
   if(d.k==="type")render();return}
 if(d.scene!==undefined){S.scenes[+d.scene][d.k]=t.value;save();const w=$("#w"+d.scene);if(w)w.innerHTML=warnHTML(+d.scene);updateSum();updateIdNote();return}
});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id==="audio"){S.audio=t.checked;render()} if(t.id==="neg"){S.neg=t.checked;save()} if(t.id==="hemat"){S.hemat=t.checked;render()} if(t.id==="autoEn"){S.autoEn=t.checked;render()} if(t.id==="danceFunny"){S.dance.funny=t.checked;S.scenes=[];render()} if(t.id==="danceOwn"){S.dance.ownSong=t.checked;save()}
 if(t.dataset.k==="type")render()});

function copyText(text,btn){const done=()=>{const o=btn.textContent;btn.textContent="Tersalin";btn.classList.add("ok");setTimeout(()=>{btn.textContent=o;btn.classList.remove("ok")},1400)};
 const fallback=()=>{const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
   try{document.execCommand("copy");done()}catch(err){alert("Salin manual: tekan lama teksnya lalu pilih Salin.")}ta.remove()};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fallback);else fallback()}

render();if(S.step===STEPS.length-1)autoTranslate();
</script>
</body>
</html>
